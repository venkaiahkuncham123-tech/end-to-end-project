name: node_Build_Deploy
on:
  workflow_dispatch:
  push:
    branches: 
      - main
permissions:
  contents: write
  packages: write
  id-token: write
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  docker_build_push:
    runs-on: self-hosted
    steps:
      - name: git-checkout
        uses: actions/checkout@v4
      - name: build-app
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Node_JS_3tier/Dockerfile.test
          push: true
          tags: venkaiahk/node-three-tier:v2

  kubernets_integration:
    runs-on: self-hosted
    needs: docker_build_push
    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          cat <<EOF > $HOME/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority-data: ${{ secrets.KUBE_CA_CERT }}
              server: ${{ secrets.KUBE_API_SERVER }}
            name: aws-kubeadm-cluster
          contexts:
          - context:
              cluster: aws-kubeadm-cluster
              namespace: test
              user: ci-deployer
            name: aws-kubeadm-context
          current-context: aws-kubeadm-context
          users:
          - name: ci-deployer
            user:
              token: ${{ secrets.KUBE_TOKEN }}
          EOF

      - name: Deploy resources
        run: |
          kubectl apply -f ./Node_JS_3tier/deploy.yaml -n test
          
